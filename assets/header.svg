<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="220" r="160" fill="#c084fc" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Border -->
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Status Chip -->
  <g transform="translate(60, 42)">
    <rect width="210" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="15" cy="15" r="4.5" fill="#10b981" />
    <text x="30" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OPEN FOR INNOVATION</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Hi there, I'm <tspan fill="url(#textGrad)">Shivant</tspan> 👋
  </text>

  <!-- Subtitle -->
  <text x="60" y="170" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600">
    🐧 Linux App Developer &amp; 🎨 UI/UX Designer &amp; ⚡ Tech Explorer
  </text>

  <!-- Description paragraph -->
  <text x="60" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Crafting clean, native, and minimalist Linux applications with GTK 4, Libadwaita &amp; AppImage.
  </text>
  <text x="60" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Always testing bleeding-edge distributions, experimental developer frameworks, and AI workflows.
  </text>

  <!-- Pills Row -->
  <g transform="translate(60, 265)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="125" height="28" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" />
      <text x="62" y="18" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700">Linux Native</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(135, 0)">
      <rect width="135" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="700">GTK4 / Libadwaita</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(280, 0)">
      <rect width="120" height="28" rx="14" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1" />
      <text x="60" y="18" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="700">UI/UX Design</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(410, 0)">
      <rect width="140" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">AppImage &amp; Flatpak</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(560, 0)">
      <rect width="140" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">Tech Beta Testing</text>
    </g>
  </g>
</svg>
